name: Release module
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Require tag to match manifest version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "JSON.parse(require('fs').readFileSync('module.json')).version")"
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/module.zip
            dist/module.json
            dist/SHA256SUMS.txt
